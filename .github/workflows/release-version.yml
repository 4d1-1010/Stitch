name: Cut a versioned release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version (overrides bump, e.g. 0.3.0)"
        required: false
        type: string

jobs:
  tag:
    name: Bump version + push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute next version
        id: ver
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re, os, sys
          init = pathlib.Path("stitch/__init__.py")
          text = init.read_text()
          m = re.search(r"__version__\s*=\s*['\"]([^'\"]+)", text)
          current = m.group(1)

          override = os.environ.get("VERSION_OVERRIDE", "").strip()
          if override:
              new = override.lstrip("v")
          else:
              bump = os.environ["BUMP"]
              parts = [int(x) for x in current.split(".")[:3]]
              while len(parts) < 3:
                  parts.append(0)
              maj, minr, pat = parts
              if bump == "major":
                  maj, minr, pat = maj + 1, 0, 0
              elif bump == "minor":
                  minr, pat = minr + 1, 0
              else:
                  pat += 1
              new = f"{maj}.{minr}.{pat}"

          init.write_text(re.sub(
              r"(__version__\s*=\s*['\"])[^'\"]+",
              lambda mo: mo.group(1) + new,
              text,
          ))
          print(f"current={current}")
          print(f"new={new}")
          PY
        env:
          BUMP: ${{ github.event.inputs.bump }}
          VERSION_OVERRIDE: ${{ github.event.inputs.version }}

      - name: Commit and tag
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stitch/__init__.py
          git commit -m "Release v${NEW}"
          git tag -a "v${NEW}" -m "Release v${NEW}"
          git push origin HEAD:main
          git push origin "v${NEW}"

      - name: Summary
        run: |
          echo "### Released v${{ steps.ver.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag pushed. The build workflow will now compile the binaries and attach them to a new GitHub release." >> "$GITHUB_STEP_SUMMARY"
