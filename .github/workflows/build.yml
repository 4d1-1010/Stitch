name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_mode:
        description: "What to publish"
        required: true
        default: "rolling"
        type: choice
        options:
          - rolling   # rebuild + overwrite the `latest` prerelease
          - patch     # bump patch, commit, tag, immutable v* release
          - minor
          - major
      exact_version:
        description: "Exact version (e.g. 0.3.0) — overrides release_mode when set"
        required: false
        type: string

jobs:
  # Decide what this run is doing and, if a versioned release was
  # requested, bump __version__ and push the tag.
  context:
    name: Compute release context
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.decide.outputs.mode }}         # rolling | versioned | build-only
      tag: ${{ steps.decide.outputs.tag }}            # e.g. v0.2.0 (versioned only)
      version: ${{ steps.decide.outputs.version }}    # e.g. 0.2.0 (versioned only)
      ref: ${{ steps.decide.outputs.ref }}            # git ref the build should check out
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide + (if needed) bump version and tag
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_MODE: ${{ github.event.inputs.release_mode }}
          DISPATCH_VERSION: ${{ github.event.inputs.exact_version }}
        run: |
          set -e

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "mode=build-only"          >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA"          >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            echo "mode=versioned"           >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}"               >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}"         >> "$GITHUB_OUTPUT"
            echo "ref=${TAG}"               >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_MODE" != "rolling" ]]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re
          init = pathlib.Path("stitch/__init__.py")
          text = init.read_text()
          current = re.search(r"__version__\s*=\s*['\"]([^'\"]+)", text).group(1)

          override = os.environ.get("DISPATCH_VERSION", "").strip()
          if override:
              new = override.lstrip("v")
          else:
              bump = os.environ["DISPATCH_MODE"]
              parts = [int(x) for x in current.split(".")[:3]]
              while len(parts) < 3:
                  parts.append(0)
              maj, minr, pat = parts
              if bump == "major":   maj, minr, pat = maj + 1, 0, 0
              elif bump == "minor": minr, pat = minr + 1, 0
              else:                 pat += 1
              new = f"{maj}.{minr}.{pat}"

          init.write_text(re.sub(
              r"(__version__\s*=\s*['\"])[^'\"]+",
              lambda mo: mo.group(1) + new,
              text,
          ))
          print(f"mode=versioned")
          print(f"tag=v{new}")
          print(f"version={new}")
          print(f"ref=v{new}")
          PY

            NEW=$(grep '^version=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stitch/__init__.py
            git commit -m "Release v${NEW}"
            git tag -a "v${NEW}" -m "Release v${NEW}"
            git push origin HEAD:main
            git push origin "v${NEW}"
            exit 0
          fi

          # Default: main push or workflow_dispatch rolling — rolling build.
          echo "mode=rolling"            >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA"         >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stitch-linux-x64
            binary: stitch
          - os: windows-latest
            artifact: stitch-windows-x64
            binary: stitch
          - os: macos-latest
            artifact: stitch-macos-arm64
            binary: stitch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxinerama-dev xclip x11-xserver-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python packaging/build.py --clean

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release-latest:
    name: Publish latest (rolling)
    needs: [context, build]
    if: needs.context.outputs.mode == 'rolling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute label
        id: label
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "label=latest-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Package binaries
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          mkdir -p release staging
          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${LABEL}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${LABEL}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-${LABEL}-windows-x64.zip" stitch )

      - name: Clear old assets on latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view latest --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset latest "$asset" \
                --repo "${{ github.repository }}" --yes || true
            done
          fi

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (rolling)"
          prerelease: true
          files: release/*
          body: |
            **Rolling build from `main` — replaced on every push.**
            Commit: [`${{ steps.label.outputs.sha_short }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            For a stable, named release, see the full
            [Releases page](https://github.com/${{ github.repository }}/releases).

            ## Install

            **Linux**
            ```bash
            tar xzf stitch-*-linux-x64.tar.gz
            ./stitch
            ```

            **macOS**
            ```bash
            tar xzf stitch-*-macos-arm64.tar.gz
            xattr -cr stitch
            ./stitch
            ```

            **Windows**
            ```text
            unzip stitch-*-windows-x64.zip
            stitch\stitch.exe
            ```

  release-versioned:
    name: Publish versioned release
    needs: [context, build]
    if: needs.context.outputs.mode == 'versioned'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        env:
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          mkdir -p release staging
          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${TAG}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${TAG}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-${TAG}-windows-x64.zip" stitch )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.context.outputs.tag }}
          name: "Stitch ${{ needs.context.outputs.tag }}"
          files: release/*
          generate_release_notes: true
          body: |
            Immutable release ${{ needs.context.outputs.tag }}.

            ## Install

            **Linux**
            ```bash
            tar xzf stitch-*-linux-x64.tar.gz
            ./stitch
            ```

            **macOS**
            ```bash
            tar xzf stitch-*-macos-arm64.tar.gz
            xattr -cr stitch
            ./stitch
            ```

            **Windows**
            ```text
            unzip stitch-*-windows-x64.zip
            stitch\stitch.exe
            ```
