name: Build binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stitch-linux-x64
            binary: stitch
          - os: windows-latest
            artifact: stitch-windows-x64
            binary: stitch
          - os: macos-latest
            artifact: stitch-macos-arm64
            binary: stitch
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxinerama-dev xclip x11-xserver-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python packaging/build.py --clean

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release-tag:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release staging

          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${TAG}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${TAG}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-${TAG}-windows-x64.zip" stitch )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  release-latest:
    name: Publish latest build
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute version
        id: ver
        run: |
          BASE=$(python -c "import re,pathlib; \
            t=pathlib.Path('stitch/__init__.py').read_text(); \
            print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', t).group(1))")
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${BASE}-dev.${{ github.run_number }}+${SHA_SHORT}"
          echo "base=${BASE}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Package binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release staging
          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${VERSION}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${VERSION}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          # Windows ships the PyInstaller onedir bundle as a zip — the
          # single-file .exe triggers Defender false-positives.
          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-${VERSION}-windows-x64.zip" stitch )

          ls -lah release/

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Stitch ${{ steps.ver.outputs.version }}"
          prerelease: true
          files: release/*
          body: |
            **Version:** `${{ steps.ver.outputs.version }}`
            **Commit:** [`${{ steps.ver.outputs.sha_short }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Built:** automatic rolling build from `main`

            ## Install

            **Linux**
            ```bash
            tar xzf stitch-*-linux-x64.tar.gz
            ./stitch
            ```

            **macOS**
            ```bash
            tar xzf stitch-*-macos-arm64.tar.gz
            xattr -cr stitch        # clear Gatekeeper quarantine
            ./stitch
            ```

            **Windows**
            ```text
            unzip stitch-*-windows-x64.zip
            stitch\stitch.exe
            ```
            (Extract the zip; run `stitch.exe` inside the `stitch` folder.)

            ---
            This release is overwritten on every push to `main`.
            For an immutable versioned release, push a `v*` tag.
