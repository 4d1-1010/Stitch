name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Auto-compute the next semver version from the most recent v* tag.
  # Runs only on push to main (not on PRs or manual tag pushes, which
  # already carry the version in github.ref_name).
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      should_release: ${{ steps.compute.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [[ -z "$LAST" ]]; then
              BASE=$(python -c "import re,pathlib; \
                t=pathlib.Path('stitch/__init__.py').read_text(); \
                print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', t).group(1))")
              VERSION="$BASE"
            else
              CURR="${LAST#v}"
              IFS='.' read -r MAJ MIN PAT <<< "$CURR"
              PAT=$((PAT + 1))
              VERSION="${MAJ}.${MIN}.${PAT}"
            fi
            TAG="v${VERSION}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="dev"
            TAG="dev"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (tag: ${TAG})"

  build:
    name: ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stitch-linux-x64
            binary: stitch
          - os: windows-latest
            artifact: stitch-windows-x64
            binary: stitch
          - os: macos-latest
            artifact: stitch-macos-arm64
            binary: stitch
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxinerama-dev xclip x11-xserver-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python packaging/build.py --clean

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release staging

          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-v${VERSION}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-v${VERSION}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-v${VERSION}-windows-x64.zip" stitch )

          ls -lah release/

      - name: Create tag on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote, skipping."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Stitch ${{ needs.version.outputs.tag }}"
          files: release/*
          generate_release_notes: true
          body: |
            Built from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ## Install

            **Linux**
            ```bash
            tar xzf stitch-*-linux-x64.tar.gz
            ./stitch
            ```

            **macOS**
            ```bash
            tar xzf stitch-*-macos-arm64.tar.gz
            xattr -cr stitch        # clear Gatekeeper quarantine
            ./stitch
            ```

            **Windows**
            ```text
            unzip stitch-*-windows-x64.zip
            stitch\stitch.exe
            ```
