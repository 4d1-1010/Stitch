name: Build binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stitch-linux-x64
            binary: stitch
          - os: windows-latest
            artifact: stitch-windows-x64
            binary: stitch.exe
          - os: macos-latest
            artifact: stitch-macos-arm64
            binary: stitch
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxinerama-dev xclip x11-xserver-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python packaging/build.py --clean

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release-tag:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename and collect binaries
        run: |
          mkdir -p release
          cp artifacts/stitch-linux-x64/stitch     release/stitch-linux-x64
          cp artifacts/stitch-windows-x64/stitch.exe release/stitch-windows-x64.exe
          cp artifacts/stitch-macos-arm64/stitch   release/stitch-macos-arm64
          chmod +x release/stitch-linux-x64 release/stitch-macos-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  release-latest:
    name: Publish latest build
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute version
        id: ver
        run: |
          BASE=$(python -c "import re,pathlib; \
            t=pathlib.Path('stitch/__init__.py').read_text(); \
            print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', t).group(1))")
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${BASE}-dev.${{ github.run_number }}+${SHA_SHORT}"
          echo "base=${BASE}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Rename and collect binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release
          cp artifacts/stitch-linux-x64/stitch       "release/stitch-${VERSION}-linux-x64"
          cp artifacts/stitch-windows-x64/stitch.exe "release/stitch-${VERSION}-windows-x64.exe"
          cp artifacts/stitch-macos-arm64/stitch     "release/stitch-${VERSION}-macos-arm64"
          chmod +x "release/stitch-${VERSION}-linux-x64" \
                   "release/stitch-${VERSION}-macos-arm64"

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Stitch ${{ steps.ver.outputs.version }}"
          prerelease: true
          files: release/*
          body: |
            **Version:** `${{ steps.ver.outputs.version }}`
            **Commit:** [`${{ steps.ver.outputs.sha_short }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Built:** automatic rolling build from `main`

            This release is overwritten on every push to `main`.
            For an immutable versioned release, push a `v*` tag.
