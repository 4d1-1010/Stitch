name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stitch-linux-x64
            binary: stitch
          - os: windows-latest
            artifact: stitch-windows-x64
            binary: stitch
          - os: macos-latest
            artifact: stitch-macos-arm64
            binary: stitch
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxinerama-dev xclip x11-xserver-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python packaging/build.py --clean

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  # Rolling pre-release, overwritten on every push to main.
  # For human-facing versioned releases, use the "Cut a versioned release"
  # workflow or push a `v*` tag — that path hits release-tag below.
  release-latest:
    name: Publish latest build
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute label
        id: label
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "label=latest-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Package binaries
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          mkdir -p release staging

          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${LABEL}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${LABEL}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-${LABEL}-windows-x64.zip" stitch )

      - name: Clear old assets on latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view latest --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset latest "$asset" \
                --repo "${{ github.repository }}" --yes || true
            done
          fi

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (rolling)"
          prerelease: true
          files: release/*
          body: |
            **Rolling build from `main` — replaced on every push.**
            Commit: [`${{ steps.label.outputs.sha_short }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            For a stable, named release, see [the Releases page](https://github.com/${{ github.repository }}/releases) or trigger the *Cut a versioned release* workflow.

            ## Install

            **Linux**
            ```bash
            tar xzf stitch-*-linux-x64.tar.gz
            ./stitch
            ```

            **macOS**
            ```bash
            tar xzf stitch-*-macos-arm64.tar.gz
            xattr -cr stitch
            ./stitch
            ```

            **Windows**
            ```text
            unzip stitch-*-windows-x64.zip
            stitch\stitch.exe
            ```

  # Immutable versioned release, created when a v* tag is pushed
  # (by the release-version workflow or manually).
  release-tag:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release staging

          cp artifacts/stitch-linux-x64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${TAG}-linux-x64.tar.gz" stitch
          rm staging/stitch

          cp artifacts/stitch-macos-arm64/stitch "staging/stitch"
          chmod +x "staging/stitch"
          tar -C staging -czf "release/stitch-${TAG}-macos-arm64.tar.gz" stitch
          rm staging/stitch

          ( cd artifacts/stitch-windows-x64 \
            && zip -r "../../release/stitch-${TAG}-windows-x64.zip" stitch )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Stitch ${{ github.ref_name }}"
          files: release/*
          generate_release_notes: true
