<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e213a"/>
      <stop offset="100%" stop-color="#11132a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>

  <!-- Monitor 1 (left) -->
  <rect x="46" y="74" width="112" height="84" rx="10" ry="10"
        fill="#e94560" stroke="#ffffff22" stroke-width="2"/>
  <rect x="80" y="162" width="44" height="6" rx="2" fill="#ffffff33"/>

  <!-- Monitor 2 (right, overlapping) -->
  <rect x="98" y="108" width="112" height="84" rx="10" ry="10"
        fill="#4a90d9" stroke="#ffffff22" stroke-width="2"/>
  <rect x="132" y="196" width="44" height="6" rx="2" fill="#ffffff33"/>

  <!-- Stitch line connecting the two monitors -->
  <path d="M 56 138 Q 128 100 200 158" stroke="#ffffff" stroke-width="4"
        fill="none" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle cx="56"  cy="138" r="5" fill="#ffffff"/>
  <circle cx="200" cy="158" r="5" fill="#ffffff"/>
</svg>
